services:
  bot:
    build: .
    container_name: tg-music-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/music.db
      DOWNLOAD_DIR: /app/data/downloads
    volumes:
      - ./data:/app/data
    # для локального Bot API server (файлы до 2 ГБ) раскомментируй:
    # networks:
    #   - telegram-bot-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
